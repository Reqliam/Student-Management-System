<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login · Octagon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy:    #0f1f3d;
            --blue:    #1a56db;
            --blue-lt: #e8f0fe;
            --accent:  #4f8fff;
            --text:    #111827;
            --sub:     #6b7280;
            --border:  #e5e7eb;
            --bg:      #f8f9fc;
            --white:   #ffffff;
            --radius:  14px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── Left panel ── */
        .left {
            width: 46%;
            min-width: 400px;
            background: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 48px 56px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            box-shadow: 4px 0 40px rgba(0,0,0,0.06);
        }

        /* top decoration line */
        .left::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--navy), var(--accent));
        }

        .brand {
            font-size: 90px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--navy);
            margin-bottom: 32px;
        }

        .brand span { color: var(--accent); }

        .heading {
            margin-bottom: 6px;
        }

        .heading h2 {
            font-size: 30px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.15;
        }

        .subtitle {
            font-size: 14px;
            color: var(--sub);
            margin-bottom: 36px;
            margin-top: 6px;
            line-height: 1.5;
        }

        /* ── Form ── */
        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--sub);
            margin-bottom: 7px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        .field input::placeholder { color: #b0b7c3; }

        .field input:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79,143,255,0.15);
            background: var(--white);
        }

        /* select arrow */
        .select-wrap { position: relative; }

        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sub);
            pointer-events: none;
            font-size: 14px;
        }

        /* ── Options row ── */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--sub);
            cursor: pointer;
            user-select: none;
        }

        .remember input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .forgot {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .forgot:hover { opacity: 0.75; }

        /* ── Submit btn ── */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            background: #162a52;
            transform: translateY(-1px);
        }

        .submit-btn:active { transform: translateY(0); }

        /* ── Register ── */
        .register {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: var(--sub);
        }

        .register a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .register a:hover { text-decoration: underline; }

        /* ── Right panel ── */
        .right {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #0a1628 0%, #0f2044 40%, #0a1e3d 100%);
        }

        .right-illustration {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .illus-svg {
            width: 100%;
            max-width: 520px;
            height: auto;
            flex-shrink: 0;
        }

        /* quote block */
        .quote-block {
            position: absolute;
            bottom: 48px;
            left: 44px;
            right: 44px;
        }

        .quote-mark {
            font-size: 64px;
            line-height: 0.6;
            color: var(--accent);
            font-family: Georgia, serif;
            opacity: 0.7;
            display: block;
            margin-bottom: 16px;
        }

        .quote-text {
            font-size: clamp(18px, 2.2vw, 24px);
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            margin-bottom: 14px;
        }

        .quote-attr {
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.5px;
        }

        /* ── Responsive ── */
        @media (max-width: 860px) {
            .right { display: none; }
            .left { width: 100%; min-width: unset; padding: 48px 28px; }
        }

        /* ── Fade in ── */
        .left > * {
            animation: fadeUp 0.45s ease both;
        }

        .brand        { animation-delay: 0.0s; }
        .heading      { animation-delay: 0.05s; }
        .subtitle     { animation-delay: 0.08s; }
        .field        { animation-delay: 0.11s; }
        .options      { animation-delay: 0.15s; }
        .submit-btn   { animation-delay: 0.18s; }
        .register     { animation-delay: 0.21s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Left panel -->
    <div class="left">
        <div class="brand">OCT<span>AGON</span></div>

        <div class="heading">
            <h2>Welcome Back</h2>
        </div>
        <p class="subtitle">Sign in to continue to your dashboard.</p>

        <form method="POST">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="field">
                <label>Role</label>
                <div class="select-wrap">
                    <select name="role" required>
                        <option value="">Select your role</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button class="submit-btn" type="submit">Sign In →</button>
        </form>

        <div class="register">
            Don't have an account? <a href="/register">Create one</a>
        </div>
    </div>

    <!-- Right panel — academic illustration -->
    <div class="right">
        <div class="right-illustration">
            <svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" class="illus-svg">
                <!-- Sky background done via CSS -->
                <!-- Moon -->
                <circle cx="480" cy="80" r="48" fill="#f0f4ff" opacity="0.15"/>
                <!-- Stars -->
                <circle cx="80"  cy="60"  r="2" fill="white" opacity="0.5"/>
                <circle cx="160" cy="30"  r="1.5" fill="white" opacity="0.4"/>
                <circle cx="300" cy="50"  r="2" fill="white" opacity="0.5"/>
                <circle cx="420" cy="100" r="1.5" fill="white" opacity="0.35"/>
                <circle cx="520" cy="40"  r="2" fill="white" opacity="0.4"/>
                <circle cx="200" cy="90"  r="1.5" fill="white" opacity="0.3"/>
                <circle cx="560" cy="130" r="1.5" fill="white" opacity="0.4"/>
                <circle cx="50"  cy="140" r="2" fill="white" opacity="0.35"/>
                <circle cx="360" cy="20"  r="1.5" fill="white" opacity="0.5"/>

                <!-- University building -->
                <!-- Main body -->
                <rect x="100" y="260" width="400" height="280" rx="4" fill="#1e3a6e" opacity="0.9"/>
                <!-- Roof / pediment -->
                <polygon points="80,260 300,160 520,260" fill="#162d55" opacity="0.95"/>
                <!-- Columns -->
                <rect x="140" y="270" width="22" height="270" rx="3" fill="#2a4a80" opacity="0.8"/>
                <rect x="200" y="270" width="22" height="270" rx="3" fill="#2a4a80" opacity="0.8"/>
                <rect x="260" y="270" width="22" height="270" rx="3" fill="#2a4a80" opacity="0.8"/>
                <rect x="320" y="270" width="22" height="270" rx="3" fill="#2a4a80" opacity="0.8"/>
                <rect x="380" y="270" width="22" height="270" rx="3" fill="#2a4a80" opacity="0.8"/>
                <rect x="438" y="270" width="22" height="270" rx="3" fill="#2a4a80" opacity="0.8"/>
                <!-- Steps -->
                <rect x="80"  y="536" width="440" height="12" rx="2" fill="#162d55"/>
                <rect x="60"  y="548" width="480" height="12" rx="2" fill="#11234a"/>
                <!-- Door -->
                <rect x="256" y="420" width="88" height="120" rx="4" fill="#0f1f3d"/>
                <rect x="260" y="424" width="80" height="112" rx="3" fill="#1a3668" opacity="0.5"/>
                <!-- Windows with light -->
                <rect x="130" y="300" width="60" height="70" rx="3" fill="#fbbf24" opacity="0.25"/>
                <rect x="134" y="304" width="52" height="62" rx="2" fill="#fbbf24" opacity="0.15"/>
                <rect x="220" y="300" width="60" height="70" rx="3" fill="#fbbf24" opacity="0.25"/>
                <rect x="224" y="304" width="52" height="62" rx="2" fill="#fbbf24" opacity="0.15"/>
                <rect x="320" y="300" width="60" height="70" rx="3" fill="#fbbf24" opacity="0.25"/>
                <rect x="324" y="304" width="52" height="62" rx="2" fill="#fbbf24" opacity="0.15"/>
                <rect x="410" y="300" width="60" height="70" rx="3" fill="#fbbf24" opacity="0.25"/>
                <rect x="414" y="304" width="52" height="62" rx="2" fill="#fbbf24" opacity="0.15"/>
                <!-- Clock tower on top -->
                <rect x="266" y="120" width="68" height="50" rx="3" fill="#162d55"/>
                <circle cx="300" cy="143" r="18" fill="#0f1f3d" stroke="#4f8fff" stroke-width="2" opacity="0.8"/>
                <line x1="300" y1="143" x2="300" y2="130" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <line x1="300" y1="143" x2="310" y2="148" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Ground -->
                <rect x="0" y="560" width="600" height="140" fill="#0a1628"/>
                <!-- Path to entrance -->
                <polygon points="240,560 360,560 420,700 180,700" fill="#111f3a"/>
                <!-- Trees -->
                <rect x="58"  y="470" width="10" height="90"  fill="#0d1e3a"/>
                <ellipse cx="63"  cy="455" rx="28" ry="35" fill="#0d4a2a" opacity="0.85"/>
                <rect x="528" y="470" width="10" height="90"  fill="#0d1e3a"/>
                <ellipse cx="533" cy="455" rx="28" ry="35" fill="#0d4a2a" opacity="0.85"/>
                <!-- Lamp posts -->
                <line x1="170" y1="480" x2="170" y2="560" stroke="#2a3a5a" stroke-width="3"/>
                <circle cx="170" cy="475" r="8" fill="#fbbf24" opacity="0.6"/>
                <line x1="430" y1="480" x2="430" y2="560" stroke="#2a3a5a" stroke-width="3"/>
                <circle cx="430" cy="475" r="8" fill="#fbbf24" opacity="0.6"/>
                <!-- Flag on top -->
                <line x1="300" y1="80" x2="300" y2="122" stroke="#4f8fff" stroke-width="2"/>
                <polygon points="300,80 330,90 300,100" fill="#4f8fff" opacity="0.8"/>
            </svg>

            <div class="quote-block">
                <span class="quote-mark">"</span>
                <p class="quote-text">Education is not the filling of a pail,<br>but the lighting of a fire.</p>
                <p class="quote-attr">— W.B. Yeats</p>
            </div>
        </div>
    </div>

</body>
</html>
